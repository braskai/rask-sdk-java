# Builds, lints and tests. Nothing here publishes: release.yml calls this before it does.
name: CI

on:
  pull_request:
  push:
    branches: [main, initial]
  workflow_call:

permissions:
  contents: read

jobs:
  generated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/test_generate.py

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp compile checkstyle:check javadoc:javadoc

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "21"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The shared acceptance harness is its own repository.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: braskai/rask-sdk-acceptance
          path: rask-sdk-acceptance
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test against the acceptance harness
        env:
          RASK_SDK_ACCEPTANCE_DIR: rask-sdk-acceptance
        run: mvn -B -ntp test
