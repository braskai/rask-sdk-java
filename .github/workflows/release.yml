# Publishes the version in pom.xml to Maven Central as ai.rask:rask-sdk, then tags it and makes the GitHub Release.
# Started by hand and only from the default branch: `gh workflow run release.yml`, or "Run workflow" on the Actions tab.
# So the workflow that reads the secrets is always the reviewed one, and nothing is public before the checks pass.
# The environment `maven-central` takes only the default branch and holds four secrets: CENTRAL_USERNAME and
# CENTRAL_PASSWORD (a user token of central.sonatype.com, where the namespace ai.rask is verified), GPG_PRIVATE_KEY and
# GPG_PASSPHRASE (the key the artifacts are signed with). RELEASING.md has the steps.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to Maven Central
    needs: checks
    runs-on: ubuntu-24.04
    environment: maven-central
    permissions:
      contents: write # the tag and the GitHub Release
    steps:
      # Before anything of this repository runs, and before the signing key is imported.
      - name: Only from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::A release is cut from $DEFAULT_BRANCH, and this run is on $GITHUB_REF_NAME."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Writes a settings.xml that reads the Central token from the environment, and imports the signing key.
      # No dependency cache in the job that holds the secrets: a cache is something another run could have written.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      # Central checks every signature against the public key on a key server. Sent from here, the key is there
      # whether or not the machine it was made on could reach the server. A server that is down is not a failure:
      # Central reads several.
      - name: The public key is on the key servers
        run: |
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          for server in keyserver.ubuntu.com keys.openpgp.org; do
            gpg --keyserver "hkps://$server" --send-keys "$fingerprint" || echo "::warning::The key was not sent to $server."
          done
      - name: The version is new
        run: |
          version=$(mvn -B -ntp -q -DforceStdout help:evaluate -Dexpression=project.version)
          tagged=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || tagged=$?
          published=$(curl -sS -o /dev/null -w '%{http_code}' "https://repo1.maven.org/maven2/ai/rask/rask-sdk/$version/rask-sdk-$version.pom")
          if [ "$tagged" != 2 ] || [ "$published" != 404 ]; then
            echo "::error::$version is already released, or that could not be checked (tag lookup $tagged, where 2 means no tag; Maven Central answered $published). Set the next version in pom.xml and SdkVersion.java first."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # The tests ran in `checks`. The profile adds the sources and javadoc jars and the signatures, uploads the bundle
      # and waits until Central has published it.
      - name: Publish
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -ntp -Prelease -DskipTests deploy
      - name: Tag the version and make the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -- "v$VERSION" --target "$GITHUB_SHA" --generate-notes
          case "$VERSION" in *-*) set -- "$@" --prerelease ;; esac
          gh release create "$@"
